<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magic • calc</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="calculator">
        <div class="header">
            <div class="logo">Magic Calc</div>
             <button class="color-toggle" id="color-toggle">🎨</button>
        </div>
        <div class="display-container">
            <div class="previous" id="previous"></div>
            <div class="current" id="current">0</div>
        </div>
        <div class="buttons">
            <button class="function clear" id="clear">AC</button>
            <button class="function" id="delete">⌫</button>
            <button class="function" id="percent">%</button>
            <button class="operator" id="divide">÷</button>
            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" id="multiply">×</button>
            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" id="subtract">−</button>
            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" id="add">+</button>
            <button class="number" data-value="0" style="grid-column: span 2;">0</button>
            <button class="decimal" data-value=".">.</button>
            <button class="equals" id="equals">=</button>
        </div>
    </div>

    <div class="footer">
        Responsive Calculator Application<br>
        Built with HTML, CSS &amp; JavaScript
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
